name: Release

# Push a tag like v1.0.0 to build every desktop/mobile app and attach it to the GitHub release.
# These are generic builds: no server address built in, the login screen asks for it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.50.1
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Pudim $TAG" --generate-notes

  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk "pudim-$TAG-android.apk"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "pudim-$TAG-android.apk" --clobber

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "pudim-$env:TAG-windows-x64.zip"
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" "pudim-$env:TAG-windows-x64.zip" --clobber

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      # Not signed or notarized: first open with right click > Open (or allow it in System Settings).
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/pudim_music.app "pudim-$TAG-macos.zip"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "pudim-$TAG-macos.zip" --clobber

  linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libmpv-dev libsecret-1-dev libayatana-appindicator3-dev
      - run: flutter build linux --release
      - run: tar -C build/linux/x64/release/bundle -czf "pudim-$TAG-linux-x64.tar.gz" .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "pudim-$TAG-linux-x64.tar.gz" --clobber
